<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#b24ad6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="720" height="300" rx="14" fill="url(#bg)"/>
  <!-- menu bar -->
  <rect x="0" y="0" width="720" height="26" rx="14" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="0" y="12" width="720" height="14" fill="#ffffff" fill-opacity="0.55"/>
  <text x="18" y="18" font-size="13" font-weight="700" fill="#111">⌘</text>
  <text x="40" y="18" font-size="13" fill="#111" font-weight="600">Finder</text>
  <text x="92" y="18" font-size="13" fill="#111">File  Edit  View  Go  Window  Help</text>
  <!-- status item -->
  <rect x="468" y="3" width="104" height="20" rx="5" fill="#000" fill-opacity="0.12"/>
  <text x="476" y="18" font-size="13" fill="#111">💼</text>
  <text x="496" y="18" font-size="13" fill="#111" font-weight="600">Work</text>
  <text x="590" y="18" font-size="13" fill="#111">🔋 ᯤ  Fri 10:24</text>
  <!-- menu -->
  <g filter="url(#shadow)">
    <rect x="440" y="30" width="262" height="252" rx="10" fill="#f6f6f8" fill-opacity="0.97"/>
  </g>
  <g font-size="12.5" fill="#1d1d1f">
    <text x="456" y="52" fill="#8e8e93">Work — Desktop 2 · Built-in Display</text>
    <text x="456" y="72">Rename “Work”…</text>
    <line x1="448" y1="82" x2="694" y2="82" stroke="#d2d2d7"/>
    <text x="456" y="101">1  🏠  Home</text>
    <rect x="446" y="108" width="250" height="20" rx="5" fill="#2f6df6"/>
    <text x="456" y="122" fill="#fff" font-weight="600">✓  2  💼  Work</text>
    <text x="456" y="143">3  🎨  Design</text>
    <text x="456" y="163">4  💬  Chats</text>
    <text x="456" y="183">⛶  Safari (Full Screen)</text>
    <line x1="448" y1="193" x2="694" y2="193" stroke="#d2d2d7"/>
    <text x="456" y="212">Quick Switcher…</text>
    <text x="640" y="212" fill="#8e8e93">⌥␣</text>
    <text x="456" y="232">Jump Back to “Design”</text>
    <text x="456" y="252">Move Front Window To</text>
    <text x="684" y="252" fill="#8e8e93">▸</text>
    <text x="456" y="272">Notes for “Work”…</text>
  </g>
  <!-- quick switcher -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="360" height="190" rx="12" fill="#ffffff" fill-opacity="0.96"/>
  </g>
  <text x="58" y="100" font-size="17" fill="#8e8e93">🔍</text>
  <text x="84" y="100" font-size="17" fill="#1d1d1f">des<tspan fill="#8e8e93">ign</tspan></text>
  <line x1="40" y1="112" x2="400" y2="112" stroke="#e5e5ea"/>
  <rect x="48" y="120" width="344" height="34" rx="7" fill="#2f6df6" fill-opacity="0.16"/>
  <text x="60" y="136" font-size="13" fill="#1d1d1f" font-weight="600">🎨  Design</text>
  <rect x="150" y="125" width="68" height="15" rx="7" fill="#2f6df6" fill-opacity="0.15"/>
  <text x="156" y="136" font-size="10" fill="#2f6df6">Best match</text>
  <text x="60" y="149" font-size="10.5" fill="#8e8e93">Desktop 3 · Built-in Display</text>
  <text x="376" y="141" font-size="11" fill="#8e8e93">1</text>
  <text x="60" y="176" font-size="13" fill="#1d1d1f">💻  Dev server</text>
  <text x="60" y="189" font-size="10.5" fill="#8e8e93">Desktop 5 · Studio Display</text>
  <text x="376" y="181" font-size="11" fill="#8e8e93">2</text>
  <line x1="40" y1="200" x2="400" y2="200" stroke="#e5e5ea"/>
  <text x="56" y="222" font-size="10.5" fill="#8e8e93">↑↓ navigate   ↩ switch   ⇧↩ move window   1–9 jump   esc close</text>
  <!-- mission control bar hint -->
  <text x="40" y="285" font-size="11" fill="#fff" fill-opacity="0.85">MacSpaceName — illustration of the menu bar item, main menu and Quick Switcher</text>
</svg>
