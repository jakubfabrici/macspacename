name: Release

# Two ways to publish:
#   1. push a tag:              git tag v0.1.0 && git push origin v0.1.0
#   2. run this workflow by hand (Actions → Release → Run workflow) with a version such as 0.1.0-beta.1;
#      the workflow then creates the tag on the chosen branch itself.
# Versions containing a hyphen (0.1.0-beta.1) are published as pre-releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Releasing $VERSION"

      - name: Test
        run: swift test

      - name: Bundle, zip and DMG
        run: make zip dmg VERSION="${{ steps.version.outputs.version }}"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MacSpaceName ${{ steps.version.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download `MacSpaceName-*.dmg`, open it and drag **MacSpaceName** to **Applications**.
            2. The app is signed ad hoc, not notarized, so macOS will refuse to open it the first time. Either run
               ```sh
               xattr -dr com.apple.quarantine /Applications/MacSpaceName.app
               ```
               or open *System Settings → Privacy & Security* and click **Open Anyway** after the first attempt.
            3. Launch it from Applications. It lives in the menu bar; grant **Accessibility** when asked so it can switch Spaces.

            Requires macOS 13 or newer. Universal binary (Apple silicon + Intel).
